name: Verify web build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # TODO: regenerate and commit package-lock.json, then restore npm ci.
      # Current lock file contains incompatible dependency versions and missing entries.
      - name: Install declared dependencies without stale lockfile
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build
        run: npm run build
